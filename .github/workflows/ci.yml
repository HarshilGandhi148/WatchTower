name: Quality control

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-runtime.txt
            pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-runtime.txt
      - run: make check-python

  javascript:
    name: JavaScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/module/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend/module ci
      - run: npm --prefix frontend ci
      - run: make check-js

  spacetime:
    name: SpacetimeDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned SpacetimeDB tooling
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.10.2/spacetimedb-update-x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/spacetime-install"
          chmod +x "$RUNNER_TEMP/spacetime-install"
          "$RUNNER_TEMP/spacetime-install" --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select tested version
        run: |
          spacetime version install 2.10.2 --yes --use
          spacetime --version
      - run: npm --prefix backend/module ci
      - run: npm --prefix frontend ci
      - run: make check-spacetime

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
