[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower"
version = "0.1.0"
description = "DTW advisory prototype: three agents and a controller dashboard"
requires-python = ">=3.12,<3.14"
dependencies = ["uagents==0.26.0"]

[tool.setuptools.packages.find]
include = ["agents*", "data*", "projection*", "shared*", "runtime*", "watchtower_client*"]
exclude = ["*.tests", "*.tests.*", "tests*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "backend", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agents", "data", "projection", "shared", "runtime", "scripts", "watchtower_client"]
exclude = ["(^|/)tests/"]

# Fetch.ai supplies annotations but no py.typed marker; inspect its source types.
[[tool.mypy.overrides]]
module = ["uagents", "uagents.*", "uagents_core", "uagents_core.*"]
follow_untyped_imports = true
